<!-- Adaptive-icon foreground. This canvas maps to the whole 108dp adaptive canvas;
     a launcher shows only the central 72dp of it and guarantees just the inner
     66dp circle is never clipped by any mask shape. The 0.72 scale is measured
     against that: the outermost points are the plate ends and the two bolt tips,
     and at this scale the furthest sits 28.3dp from centre — inside the 33dp safe
     radius, while still filling ~78% of the visible width so the mark does not
     float in empty plate.

     scripts/fix-adaptive-icon.mjs exists to keep that mapping true: the asset
     generator otherwise insets this layer a second time. Background is
     transparent by design; icon-background.svg supplies the plate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bolt" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="0.34" stop-color="#7dd3fc"/>
      <stop offset="0.62" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="iron" gradientUnits="userSpaceOnUse" x1="0" y1="418" x2="0" y2="608">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="0.5" stop-color="#c2cad6"/>
      <stop offset="1" stop-color="#79849a"/>
    </linearGradient>
  </defs>

  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <g fill="url(#iron)">
      <rect x="262" y="484" width="500" height="56" rx="28"/>
      <rect x="202" y="426" width="70" height="172" rx="28"/>
      <rect x="752" y="426" width="70" height="172" rx="28"/>
      <rect x="140" y="460" width="54" height="104" rx="24"/>
      <rect x="830" y="460" width="54" height="104" rx="24"/>
    </g>
    <path d="M562 196 L400 556 L491 556 L462 828 L630 448 L534 448 Z"
          fill="url(#bolt)" stroke="#04050a" stroke-width="30"
          stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
